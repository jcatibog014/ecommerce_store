# Alembic (database migrations) settings, for the command line:
#   .venv\Scripts\alembic revision --autogenerate --rev-id 0002 -m "what changed"
# The app runs migrations itself with: flask --app dfjc upgrade-db
[alembic]
script_location = dfjc/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
