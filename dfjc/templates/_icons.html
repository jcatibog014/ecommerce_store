{# One small line drawing per category, for products without a photo (models.CATEGORY_ICONS). #}
{% macro category_icon(name) %}
  <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'bottle' %}
      <path d="M20 5h8v6l3 5v25a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3V16l3-5z"></path><path d="M17 24h14M17 33h14"></path>
    {% elif name == 'snack' %}
      <path d="M13 6h22l-2 5 2 5-2 22 2 4H13l2-4-2-22 2-5z"></path><path d="M19 22c2-3 8-3 10 0M19 29h10"></path>
    {% elif name == 'can' %}
      <ellipse cx="24" cy="11" rx="12" ry="4"></ellipse><path d="M12 11v26c0 2.2 5.4 4 12 4s12-1.8 12-4V11"></path><path d="M12 20c0 2.2 5.4 4 12 4s12-1.8 12-4"></path>
    {% elif name == 'noodles' %}
      <path d="M7 24h34a17 13 0 0 1-34 0z"></path><path d="M18 18c0-4 4-4 4-8M26 18c0-4 4-4 4-8"></path><path d="M16 42h16"></path>
    {% elif name == 'rice' %}
      <path d="M16 8h16l-3 6c6 4 9 11 9 18 0 6-6 10-14 10s-14-4-14-10c0-7 3-14 9-18z"></path><path d="M19 14h10"></path><path d="M20 28l4 3 4-3"></path>
    {% elif name == 'condiment' %}
      <path d="M21 4h6v7l4 4v26a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3V15l4-4z"></path><rect x="17" y="24" width="14" height="9" rx="1.5"></rect>
    {% elif name == 'care' %}
      <path d="M22 5h10M27 5v6M21 11h12v5H21z"></path><path d="M18 16h18v24a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z"></path><path d="M22 28h10"></path>
    {% elif name == 'home' %}
      <path d="M16 12h10l3 6v22a4 4 0 0 1-4 4h-6a4 4 0 0 1-4-4V18z"></path><path d="M16 12V7h8v5M26 9h7l4 4"></path><path d="M16 27h13"></path>
    {% elif name == 'frozen' %}
      <path d="M24 5v38M7.5 14.5l33 19M7.5 33.5l33-19"></path><path d="M19 8l5 4 5-4M19 40l5-4 5 4"></path>
    {% elif name == 'bread' %}
      <path d="M8 22c0-7 7-11 16-11s16 4 16 11c0 3-2 4-4 4v14H12V26c-2 0-4-1-4-4z"></path><path d="M19 18l-2 5M27 18l-2 5"></path>
    {% elif name == 'candy' %}
      <ellipse cx="24" cy="24" rx="9" ry="7"></ellipse><path d="M15 24l-9-6v12zM33 24l9-6v12z"></path><path d="M21 19c2 3 2 7 0 10"></path>
    {% else %}
      <path d="M8 16l16-8 16 8v18l-16 8-16-8z"></path><path d="M8 16l16 8 16-8M24 24v18"></path>
    {% endif %}
  </svg>
{% endmacro %}
