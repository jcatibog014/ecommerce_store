# Render "Blueprint": tells Render how to build and run DFJC Store.
# Render reads this file when you choose New -> Blueprint and pick this repo.
# The service name becomes the web address: dfjc-store.onrender.com
# (Render adds a few letters if that name is already taken).
# Every merge into main deploys the site again by itself.
#
# The data (products, photos, orders) lives in Neon (free PostgreSQL), not on
# Render: Render's free plan forgets its files every time it restarts.
# Step-by-step notes: docs/DEPLOY.md
services:
  - type: web
    name: dfjc-store
    runtime: python  # the version comes from the .python-version file
    plan: free  # sleeps after 15 quiet minutes; the next visit wakes it up (about 30-50 s)
    region: singapore  # close to the Philippines, and to Neon's Singapore database
    branch: main
    buildCommand: pip install -r requirements.txt
    # First upgrade-db runs the Alembic migrations (it keeps all data, and does
    # nothing when the tables are up to date). Then gunicorn calls create_app()
    # to build the app and serves it on Render's port.
    startCommand: flask --app dfjc upgrade-db && gunicorn "dfjc:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Signs the login cookie and the password-reset links. Render makes a long random one.
      - key: SECRET_KEY
        generateValue: true
      # Neon's connection string (postgresql://...). Render asks for it when
      # you make the Blueprint; it is never written in this file.
      - key: DATABASE_URL
        sync: false
      # PayMongo (test mode first): the secret key (sk_test_...) and the webhook's
      # secret (whsk_...). Without them the live site takes cash only.
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      # Order emails and password resets: a Gmail address and its app password.
      # Without them, emails are only written to Render's log.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
